name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Python tests
        run: python3 tests/test_duck2spark.py
      - name: Run shell tests
        run: bash tests/test_digiducky_compile.sh
